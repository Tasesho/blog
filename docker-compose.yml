services:
  blog:
    build: .
    container_name: tase-blog
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - visitor-counter
    networks: [proxy, app]

  visitor-counter:
    build:
      context: .
      dockerfile: Dockerfile.counter
    restart: unless-stopped
    volumes:
      - visitor-data:/data
    networks: [app]

volumes:
  visitor-data:

networks:
  proxy:
    external: true
  app:
    internal: true
